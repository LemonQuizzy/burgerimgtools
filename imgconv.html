<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Converter — imgtools</title>
  <link rel="stylesheet" href="common.css">
  <script src="theme-init.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    .drop-zone {
      border: 1px dashed var(--border-hover);
      background: var(--surface-2);
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      margin-top: 6px;
      position: relative;
    }
    .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-dim); }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
      margin: 0; padding: 0; border: none; background: none;
      width: 100%; height: 100%;
    }
    .drop-zone-text { font-family: var(--mono); font-size: 12px; color: var(--text-muted); pointer-events: none; }
    .drop-zone-text strong { color: var(--accent); }

    .section-divider { border: none; border-top: 1px solid var(--border); margin: 24px 0 20px; }

    .format-row { display: flex; gap: 4px; flex-wrap: wrap; }
    .fmt-btn {
      flex: 1; min-width: 60px; padding: 9px 4px;
      font-family: var(--mono); font-size: 12px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer; text-align: center;
      transition: all .15s; letter-spacing: .02em;
    }
    .fmt-btn:hover { color: var(--text); border-color: var(--border-hover); }
    .fmt-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

    .quality-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .quality-val { font-family: var(--mono); font-size: 13px; color: var(--accent); }

    .file-list { display: flex; flex-direction: column; gap: 5px; margin-top: 16px; }
    .file-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface-2); border: 1px solid var(--border);
      padding: 8px 12px; font-family: var(--mono); font-size: 12px;
    }
    .fi-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .fi-from { color: var(--text-dim); white-space: nowrap; }
    .fi-arrow { color: var(--text-dim); }
    .fi-to { white-space: nowrap; }
    .fi-to.done { color: var(--accent); }
    .fi-to.error { color: #ff4d6d; }

    .png-note { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 6px; display: none; }
    .png-note.visible { display: block; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo"><a href="index.html">imgtools</a></div>
    <nav class="nav">
      <a href="index.html">Главная</a>
      <a href="batchcomp.html">Компрессор</a>
      <a href="exif.html">EXIF</a>
      <a href="imgconv.html" class="active">Конвертер</a>
    </nav>
  </header>

  <main class="container">
    <h1>Image Converter</h1>
    <p>Конвертация изображений без загрузки на сервер. Всё работает локально.</p>

    <label>Выбери файл(ы)</label>
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" multiple>
      <div class="drop-zone-text">
        Перетащи сюда или <strong>нажми для выбора</strong><br>
        <span style="font-size:11px;color:var(--text-dim)">JPG, PNG, WebP, GIF, BMP, AVIF и другие</span>
      </div>
    </div>

    <hr class="section-divider">

    <div style="display:flex;flex-direction:column;gap:16px;">
      <div>
        <label>Конвертировать в</label>
        <div class="format-row">
          <button type="button" class="fmt-btn active" data-fmt="image/jpeg" data-ext="jpg" aria-pressed="true">JPG</button>
          <button type="button" class="fmt-btn" data-fmt="image/png" data-ext="png" aria-pressed="false">PNG</button>
          <button type="button" class="fmt-btn" data-fmt="image/webp" data-ext="webp" aria-pressed="false">WebP</button>
          <button type="button" class="fmt-btn" data-fmt="image/avif" data-ext="avif" aria-pressed="false">AVIF</button>
          <button type="button" class="fmt-btn" data-fmt="image/bmp" data-ext="bmp" aria-pressed="false">BMP</button>
        </div>
        <div class="png-note" id="pngNote">PNG и BMP — без потерь, ползунок качества не влияет</div>
      </div>

      <div>
        <div class="quality-row">
          <label style="margin:0;">Качество</label>
          <span class="quality-val" id="qualityValue">90%</span>
        </div>
        <input type="range" id="quality" min="1" max="100" value="90">
      </div>
    </div>

    <div class="file-list" id="fileList"></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>

    <div class="actions" style="margin-top:20px;">
      <button id="convertBtn" class="primary" disabled>Конвертировать</button>
      <button id="downloadAllBtn" disabled>Скачать</button>
      <button id="toCompBtn" class="handoff-btn" disabled>В компрессор →</button>
      <button id="toExifBtn" class="handoff-btn" disabled>В EXIF →</button>
      <button id="resetBtn">Сброс</button>
    </div>
  </main>

  <footer>imgtools</footer>

  <script src="handoff.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const dropZone = $('dropZone'), fileInput = $('fileInput'), qualityInput = $('quality'), qualityValue = $('qualityValue'),
          fileList = $('fileList'), convertBtn = $('convertBtn'), downloadAllBtn = $('downloadAllBtn'),
          resetBtn = $('resetBtn'), pngNote = $('pngNote'), statusEl = $('status'),
          toCompBtn = $('toCompBtn'), toExifBtn = $('toExifBtn');

    const CONCURRENCY = 3;
    let currentFmt = 'image/jpeg', currentExt = 'jpg', files = [], results = [];

    const say = (msg, err) => { statusEl.textContent = msg; statusEl.classList.toggle('error', !!err); };
    qualityInput.oninput = () => { qualityValue.textContent = qualityInput.value + '%'; };

    // Проверяем, какие форматы браузер реально умеет кодировать (иначе toBlob молча вернёт PNG)
    const probe = fmt => new Promise(res => {
      const c = document.createElement('canvas'); c.width = c.height = 1;
      c.toBlob(b => res(!!b && b.type === fmt), fmt);
    });
    document.querySelectorAll('.fmt-btn').forEach(async b => {
      if (!(await probe(b.dataset.fmt))) { b.disabled = true; b.title = 'Этот браузер не поддерживает кодирование в ' + b.textContent; }
    });

    document.querySelectorAll('.fmt-btn').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('.fmt-btn').forEach(x => { x.classList.remove('active'); x.setAttribute('aria-pressed', 'false'); });
        b.classList.add('active'); b.setAttribute('aria-pressed', 'true');
        currentFmt = b.dataset.fmt; currentExt = b.dataset.ext;
        const lossless = currentFmt === 'image/png' || currentFmt === 'image/bmp';
        pngNote.classList.toggle('visible', lossless);
        qualityInput.disabled = lossless;
      };
    });

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault(); dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files.length) loadFiles(e.dataTransfer.files);
    });
    fileInput.onchange = e => { if (e.target.files.length) loadFiles(e.target.files); };
    document.addEventListener('paste', e => {
      const imgs = Array.from(e.clipboardData ? e.clipboardData.files : []).filter(f => f.type.startsWith('image/'));
      if (imgs.length) loadFiles(imgs);
    });

    function loadFiles(f) {
      files = Array.from(f).filter(x => x.type.startsWith('image/') || /\.(avif|heic|bmp)$/i.test(x.name));
      results = [];
      fileList.textContent = '';
      say('');
      convertBtn.disabled = !files.length;
      downloadAllBtn.disabled = true;
      toCompBtn.disabled = true;
      toExifBtn.disabled = true;
      downloadAllBtn.textContent = files.length > 1 ? 'Скачать ZIP' : 'Скачать';
      files.forEach((file, i) => {
        const el = document.createElement('div'); el.className = 'file-item';
        const name = document.createElement('span'); name.className = 'fi-name'; name.textContent = file.name;
        const from = document.createElement('span'); from.className = 'fi-from'; from.textContent = (file.name.split('.').pop() || '').toUpperCase() + ' · ' + formatBytes(file.size);
        const arrow = document.createElement('span'); arrow.className = 'fi-arrow'; arrow.textContent = '→';
        const to = document.createElement('span'); to.className = 'fi-to'; to.id = 'fi' + i; to.textContent = 'ожидание';
        el.append(name, from, arrow, to);
        fileList.appendChild(el);
      });
    }

    function convertOne(file, i, fmt, ext, q) {
      return new Promise(resolve => {
        const span = $('fi' + i);
        span.textContent = 'обработка…'; span.className = 'fi-to';
        const fail = msg => { span.textContent = msg; span.className = 'fi-to error'; resolve(); };
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onerror = () => { URL.revokeObjectURL(url); fail('не удалось прочитать'); };
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          if (fmt === 'image/jpeg' || fmt === 'image/bmp') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          canvas.toBlob(blob => {
            if (!blob || blob.type !== fmt) return fail('формат не поддерживается');
            results[i] = { blob, name: file.name.replace(/\.[^.]+$/, '') + '.' + ext };
            const pct = Math.round((1 - blob.size / file.size) * 100);
            span.textContent = formatBytes(blob.size) + ' (' + (pct > 0 ? '−' + pct : '+' + Math.abs(pct)) + '%)';
            span.className = 'fi-to done';
            resolve();
          }, fmt, q);
        };
        img.src = url;
      });
    }

    convertBtn.onclick = async () => {
      convertBtn.disabled = true; downloadAllBtn.disabled = true;
      results = [];
      const fmt = currentFmt, ext = currentExt, q = qualityInput.value / 100;
      let next = 0;
      const worker = async () => { while (next < files.length) { const i = next++; await convertOne(files[i], i, fmt, ext, q); } };
      await Promise.all(Array.from({ length: Math.min(CONCURRENCY, files.length) }, worker));
      const ok = results.filter(Boolean).length;
      say(ok ? 'Готово: ' + ok + ' из ' + files.length : 'Ничего не удалось конвертировать', !ok);
      downloadAllBtn.disabled = !ok;
      toCompBtn.disabled = !ok;
      toExifBtn.disabled = !results.some(r => r && r.blob.type === 'image/jpeg');
      convertBtn.disabled = false;
    };

    function save(blob, name) {
      const a = document.createElement('a');
      const url = URL.createObjectURL(blob);
      a.href = url; a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    downloadAllBtn.onclick = async () => {
      const done = results.filter(Boolean);
      if (done.length === 1) return save(done[0].blob, done[0].name);
      if (typeof JSZip === 'undefined') { say('Библиотека ZIP не загружена. Подключись к интернету и обнови страницу.', true); return; }
      const zip = new JSZip(), used = new Set();
      done.forEach(r => {
        let n = r.name, k = 2;
        const dot = n.lastIndexOf('.'), base = n.slice(0, dot), ext = n.slice(dot);
        while (used.has(n.toLowerCase())) n = base + ' (' + k++ + ')' + ext;
        used.add(n.toLowerCase());
        zip.file(n, r.blob);
      });
      save(await zip.generateAsync({ type: 'blob' }), 'imgtools_converted.zip');
    };

    toCompBtn.onclick = () => {
      const items = results.filter(Boolean).map(r => ({ blob: r.blob, name: r.name }));
      if (items.length) sendTo('batchcomp.html', items);
    };
    toExifBtn.onclick = () => {
      const items = results.filter(r => r && r.blob.type === 'image/jpeg').map(r => ({ blob: r.blob, name: r.name }));
      if (items.length) sendTo('exif.html', items);
    };

    resetBtn.onclick = () => location.reload();

    function formatBytes(b) {
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      return (b / 1048576).toFixed(2) + ' MB';
    }

    // ── приём файлов из другого инструмента ──
    takeHandoff().then(files => { if (files && files.length) loadFiles(files); }).catch(() => {});
  </script>
  <script src="settings.js"></script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
