<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doc Converter — imgtools</title>
  <link rel="stylesheet" href="common.css">
  <script src="theme-init.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    .drop-zone {
      border: 1px dashed var(--border-hover);
      background: var(--surface-2);
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      margin-top: 6px;
      position: relative;
    }
    .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-dim); }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
      margin: 0; padding: 0; border: none; background: none;
      width: 100%; height: 100%;
    }
    .drop-zone-text { font-family: var(--mono); font-size: 12px; color: var(--text-muted); pointer-events: none; }
    .drop-zone-text strong { color: var(--accent); }

    .section-divider { border: none; border-top: 1px solid var(--border); margin: 24px 0 20px; }

    .format-row { display: flex; gap: 4px; flex-wrap: wrap; }
    .fmt-btn {
      flex: 1; min-width: 60px; padding: 9px 4px;
      font-family: var(--mono); font-size: 12px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer; text-align: center;
      transition: all .15s; letter-spacing: .02em;
    }
    .fmt-btn:hover:not(:disabled) { color: var(--text); border-color: var(--border-hover); }
    .fmt-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
    .fmt-btn:disabled { opacity: .25; cursor: default; }

    .file-list { display: flex; flex-direction: column; gap: 5px; margin-top: 16px; }
    .file-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface-2); border: 1px solid var(--border);
      padding: 8px 12px; font-family: var(--mono); font-size: 12px;
      cursor: pointer; transition: border-color .15s;
    }
    .file-item:hover { border-color: var(--border-hover); }
    .file-item.selected { border-color: var(--accent); }
    .fi-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
    .fi-size { color: var(--text-dim); white-space: nowrap; }
    .fi-from { color: var(--text-dim); white-space: nowrap; }
    .fi-arrow { color: var(--text-dim); }
    .fi-to { white-space: nowrap; }
    .fi-to.done { color: var(--accent); }
    .fi-to.error { color: #ff4d6d; }
    .fi-to.wait { color: var(--text-dim); }

    .preview { display: none; margin-top: 24px; width: 100%; }
    .preview.visible { display: flex; }
    .preview-column {
      flex: 1 1 0; min-width: 0;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 20px 24px;
      max-height: 480px;
      overflow: auto;
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
    }
    .preview-column pre {
      white-space: pre-wrap; word-break: break-word;
      font-family: var(--mono); font-size: 12px; margin: 0;
    }
    .preview-column h1, .preview-column h2, .preview-column h3 { margin: 14px 0 8px; }
    .preview-column p { color: var(--text); margin: 0 0 12px; }
    .preview-column img { max-width: 100%; }
    .preview-column pre, .preview-column code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; }
    .preview-column pre { padding: 12px; overflow: auto; }
    .preview-column code { padding: 2px 5px; font-size: .9em; }
    .preview-column table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    .preview-column th, .preview-column td { border: 1px solid var(--border); padding: 6px 10px; font-size: 13px; }
    .preview-column blockquote { border-left: 3px solid var(--accent); margin: 12px 0; padding: 2px 14px; color: var(--text-muted); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo"><a href="index.html">imgtools</a></div>
    <nav class="nav">
      <a href="index.html">Главная</a>
      <a href="batchcomp.html">Компрессор</a>
      <a href="exif.html">EXIF</a>
      <a href="imgconv.html">Конвертер</a>
      <a href="docconv.html" class="active">Документы</a>
    </nav>
  </header>

  <main class="container">
    <h1>Doc Converter</h1>
    <p>Конвертация документов без загрузки на сервер: Markdown, TXT, HTML и Word. Пакетная обработка. Всё работает локально в браузере.</p>

    <label>Выбери файл(ы)</label>
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept=".md,.markdown,.txt,.html,.htm,.docx" multiple>
      <div class="drop-zone-text">
        Перетащи сюда или <strong>нажми для выбора</strong><br>
        <span style="font-size:11px;color:var(--text-dim)">MD, TXT, HTML, DOCX — можно несколько</span>
      </div>
    </div>

    <div class="file-list" id="fileList"></div>

    <hr class="section-divider">

    <div>
      <label>Конвертировать в</label>
      <div class="format-row" id="formatRow">
        <button type="button" class="fmt-btn active" data-fmt="pdf" aria-pressed="true">PDF</button>
        <button type="button" class="fmt-btn" data-fmt="docx" aria-pressed="false">DOCX</button>
        <button type="button" class="fmt-btn" data-fmt="html" aria-pressed="false">HTML</button>
        <button type="button" class="fmt-btn" data-fmt="txt" aria-pressed="false">TXT</button>
        <button type="button" class="fmt-btn" data-fmt="md" aria-pressed="false">MD</button>
      </div>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <div class="preview" id="preview">
      <div class="preview-column" id="previewCol"></div>
    </div>

    <div class="actions" style="margin-top:20px;">
      <button id="convertBtn" class="primary" disabled>Конвертировать все</button>
      <button id="resetBtn">Сброс</button>
    </div>
  </main>

  <footer>imgtools</footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown/dist/turndown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.9/build/pdfmake.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdfmake@0.2.9/build/vfs_fonts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-pdfmake@2.5.12/index.min.js"></script>
  <script>
  (function(){
    "use strict";

    var MAP = {
      md:      { targets: ["pdf","docx","html","txt"] },
      markdown:{ targets: ["pdf","docx","html","txt"] },
      txt:     { targets: ["md","pdf","docx","html"] },
      html:    { targets: ["md","pdf","docx","txt"] },
      htm:     { targets: ["md","pdf","docx","txt"] },
      docx:    { targets: ["md","pdf","html","txt"] }
    };

    var queue = [];   // {id, file, ext, text, html, el, toEl}
    var target = "pdf";
    var selectedId = null;

    function $(id){ return document.getElementById(id); }
    var dropZone = $("dropZone"), fileInput = $("fileInput"),
        convertBtn = $("convertBtn"), resetBtn = $("resetBtn"),
        statusEl = $("status"), fileList = $("fileList"),
        preview = $("preview"), previewCol = $("previewCol");

    function setStatus(msg, isErr){
      statusEl.textContent = msg || "";
      statusEl.classList.toggle("error", !!isErr);
    }

    function delay(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

    // ---- загрузка ----
    ["dragover","dragenter"].forEach(function(ev){
      dropZone.addEventListener(ev, function(e){ e.preventDefault(); dropZone.classList.add("drag-over"); });
    });
    ["dragleave","drop"].forEach(function(ev){
      dropZone.addEventListener(ev, function(e){ e.preventDefault(); dropZone.classList.remove("drag-over"); });
    });
    dropZone.addEventListener("drop", function(e){
      if (e.dataTransfer.files.length) loadFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener("change", function(){ if (fileInput.files.length) loadFiles(fileInput.files); });

    function loadFiles(files){
      setStatus("Читаю файлы…");
      var jobs = Array.prototype.map.call(files, function(file){
        var ext = (file.name.split(".").pop() || "").toLowerCase();
        if (!MAP[ext]) {
          setStatus("Пропущен неподдерживаемый формат: " + file.name, true);
          return Promise.resolve(null);
        }
        var read;
        if (ext === "docx"){
          read = file.arrayBuffer().then(function(buf){
            return mammoth.convertToHtml({ arrayBuffer: buf }).then(function(res){
              return mammoth.extractRawText({ arrayBuffer: buf }).then(function(r2){
                return { text: r2.value, html: res.value };
              });
            });
          });
        } else {
          read = file.text().then(function(text){
            var html = (ext === "html" || ext === "htm") ? text : marked.parse(text);
            return { text: text, html: html };
          });
        }
        return read.then(function(data){
          return { id: Date.now() + Math.random(), file: file, ext: ext,
                   text: data.text, html: data.html, el: null, toEl: null };
        }).catch(function(err){
          setStatus("Ошибка чтения " + file.name + ": " + err.message, true);
          return null;
        });
      });
      Promise.all(jobs).then(function(items){
        items.forEach(function(it){ if (it) addItem(it); });
        if (queue.length){
          setStatus("Загружено файлов: " + queue.length + ". Выбери целевой формат и нажми «Конвертировать все».");
        }
      });
    }

    function addItem(item){
      queue.push(item);
      var el = document.createElement("div");
      el.className = "file-item";
      el.innerHTML =
        '<span>📄</span>' +
        '<span class="fi-name"></span>' +
        '<span class="fi-size"></span>' +
        '<span class="fi-from"></span>' +
        '<span class="fi-arrow">→</span>' +
        '<span class="fi-to wait">…</span>';
      el.querySelector(".fi-name").textContent = item.file.name;
      el.querySelector(".fi-size").textContent = (item.file.size/1024).toFixed(1) + " КБ";
      el.querySelector(".fi-from").textContent = item.ext.toUpperCase();
      item.el = el;
      item.toEl = el.querySelector(".fi-to");
      el.addEventListener("click", function(){ selectItem(item); });
      fileList.appendChild(el);
      refreshFormats();
      convertBtn.disabled = false;
      selectItem(item);
    }

    function selectItem(item){
      selectedId = item.id;
      queue.forEach(function(q){ q.el.classList.toggle("selected", q.id === item.id); });
      renderPreview(item);
    }

    // ---- выбор формата ----
    document.querySelectorAll(".fmt-btn").forEach(function(b){
      b.addEventListener("click", function(){
        if (b.disabled) return;
        document.querySelectorAll(".fmt-btn").forEach(function(x){
          x.classList.remove("active"); x.setAttribute("aria-pressed","false");
        });
        b.classList.add("active"); b.setAttribute("aria-pressed","true");
        target = b.dataset.fmt;
        refreshFormats();
        var sel = queue.filter(function(q){ return q.id === selectedId; })[0];
        if (sel) renderPreview(sel);
      });
    });

    function refreshFormats(){
      // кнопка доступна, если хотя бы один файл может быть конвертирован в этот формат
      document.querySelectorAll(".fmt-btn").forEach(function(b){
        var ok = queue.some(function(q){ return MAP[q.ext].targets.indexOf(b.dataset.fmt) !== -1; });
        b.disabled = !ok;
      });
      queue.forEach(function(q){
        var can = MAP[q.ext].targets.indexOf(target) !== -1;
        q.toEl.textContent = can ? target.toUpperCase() : "—";
        q.toEl.className = "fi-to wait";
      });
    }

    resetBtn.addEventListener("click", function(){
      queue = []; selectedId = null;
      fileList.innerHTML = "";
      fileInput.value = "";
      preview.classList.remove("visible");
      convertBtn.disabled = true;
      refreshFormats();
      setStatus("");
    });

    // ---- helpers ----
    function baseName(name){ return name.replace(/\.[^.]+$/, ""); }

    function download(blob, filename){
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    }

    function htmlForExport(html){
      return '<!DOCTYPE html><html><head><meta charset="utf-8">' +
        '<style>' +
        'body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 24px;' +
        'color:#111;line-height:1.6;font-size:15px;}' +
        'img{max-width:100%;}pre,code{background:#f3f4f6;border-radius:4px;}' +
        'pre{padding:12px;overflow:auto;}code{padding:2px 5px;font-size:.9em;}' +
        'table{border-collapse:collapse;width:100%;}th,td{border:1px solid #ccc;padding:6px 10px;}' +
        'blockquote{border-left:3px solid #888;margin-left:0;padding-left:14px;color:#555;}' +
        '</style></head><body>' + html + '</body></html>';
    }

    // для PDF: убираем картинки без data-URL (внешние ссылки в PDF не встроить)
    function stripImgs(html){
      var d = new DOMParser().parseFromString(html, "text/html");
      d.querySelectorAll("img").forEach(function(img){
        if (img.src.indexOf("data:") !== 0) img.remove();
      });
      return d.body.innerHTML;
    }

    // ---- конвертация одного файла ----
    function convertItem(item){
      var html = item.html || marked.parse(item.text);
      var name = baseName(item.file.name) + "." + target;

      if (target === "html"){
        download(new Blob([htmlForExport(html)], {type:"text/html;charset=utf-8"}), name);
        return Promise.resolve();
      }
      if (target === "txt"){
        var text = item.text;
        if (!text && html){
          var doc = new DOMParser().parseFromString(html, "text/html");
          text = doc.body.textContent || "";
        }
        download(new Blob([text], {type:"text/plain;charset=utf-8"}), name);
        return Promise.resolve();
      }
      if (target === "md"){
        var md = new TurndownService({ headingStyle:"atx", codeBlockStyle:"fenced" }).turndown(html);
        download(new Blob([md], {type:"text/markdown;charset=utf-8"}), name);
        return Promise.resolve();
      }
      if (target === "docx"){
        var blob = htmlDocx.asBlob(htmlForExport(html), { margins:{ top:720, bottom:720, left:720, right:720 } });
        download(blob, name);
        return Promise.resolve();
      }
      // pdf — через pdfmake: надёжно, без снимков экрана, кириллица ок
      var content = htmlToPdfmake(stripImgs(html), {
        defaultStyles: {
          p:     { fontSize: 11, lineHeight: 1.4, margin: [0, 4, 0, 4] },
          h1:    { fontSize: 20, bold: true, margin: [0, 12, 0, 6] },
          h2:    { fontSize: 16, bold: true, margin: [0, 10, 0, 5] },
          h3:    { fontSize: 13, bold: true, margin: [0, 8, 0, 4] },
          pre:   { background: "#f3f4f6", margin: [0, 6, 0, 6] },
          code:  { background: "#f3f4f6", fontSize: 10 },
          blockquote:{ italics: true, margin: [8, 4, 8, 4] },
          table: { margin: [0, 6, 0, 6] },
          th:    { bold: true, fillColor: "#eeeeee" }
        }
      });
      var docDef = {
        pageSize: "A4",
        pageMargins: [48, 56, 48, 56],
        content: content,
        defaultStyle: { fontSize: 11, lineHeight: 1.4 }
      };
      return new Promise(function(resolve, reject){
        try {
          pdfMake.createPdf(docDef).download(name, function(){ resolve(); });
        } catch (err) { reject(err); }
      });
    }

    convertBtn.addEventListener("click", function(){
      if (!queue.length) return;
      convertBtn.disabled = true;
      var okCount = 0, errCount = 0;
      var chain = Promise.resolve();
      queue.forEach(function(item){
        if (MAP[item.ext].targets.indexOf(target) === -1){
          item.toEl.textContent = "пропуск";
          item.toEl.className = "fi-to wait";
          return;
        }
        chain = chain.then(function(){
          item.toEl.textContent = "…";
          item.toEl.className = "fi-to wait";
          setStatus("Конвертирую: " + item.file.name);
          return convertItem(item).then(function(){
            item.toEl.textContent = "готово";
            item.toEl.className = "fi-to done";
            okCount++;
            return delay(500); // пауза, чтобы браузер не блокировал серию скачиваний
          }).catch(function(err){
            console.error(err);
            item.toEl.textContent = "ошибка";
            item.toEl.className = "fi-to error";
            errCount++;
          });
        });
      });
      chain.then(function(){
        setStatus("Готово: " + okCount + " файл(ов)" + (errCount ? ", ошибок: " + errCount : "") + ".");
        convertBtn.disabled = false;
      });
    });

    // ---- предпросмотр ----
    function renderPreview(item){
      var html = item.html || marked.parse(item.text);
      if (target === "md"){
        var md = new TurndownService({ headingStyle:"atx" }).turndown(html);
        previewCol.innerHTML = "<pre></pre>";
        previewCol.querySelector("pre").textContent = md.slice(0, 200000);
      } else if (target === "txt"){
        var doc = new DOMParser().parseFromString(html, "text/html");
        previewCol.innerHTML = "<pre></pre>";
        previewCol.querySelector("pre").textContent = (doc.body.textContent || item.text || "").slice(0, 200000);
      } else {
        previewCol.innerHTML = html;
      }
      preview.classList.add("visible");
      previewCol.scrollTop = 0;
    }
  })();
  </script>
  <script src="settings.js"></script>
  <script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
